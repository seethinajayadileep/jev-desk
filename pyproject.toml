[project]
name = "jev-desk"
version = "0.1.0"
description = "One Jev call sorts the inbox. Your code decides who gets it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typesafe-sdk>=0.7",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-desk = "jev_desk.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
